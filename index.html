<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Guestbook – v2</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 3rem 1rem;
      background: radial-gradient(circle at top, #e5edff, #f5f7fb 28rem);
    }

    main {
      width: min(100%, 42rem);
      margin: 0 auto;
    }

    .card {
      padding: clamp(1.25rem, 5vw, 2.5rem);
      border: 1px solid #e4e9f2;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(28 43 75 / 8%);
    }

    h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 7vw, 2.75rem); }
    .intro { margin: 0 0 1.75rem; color: #5b667a; }

    form { display: grid; gap: .75rem; }

    label { font-weight: 650; }

    textarea {
      width: 100%;
      min-height: 7rem;
      resize: vertical;
      padding: .875rem 1rem;
      border: 1px solid #cbd4e2;
      border-radius: .75rem;
      font: inherit;
    }

    textarea:focus {
      outline: 3px solid rgb(56 103 214 / 22%);
      border-color: #3867d6;
    }

    button {
      justify-self: start;
      min-height: 2.75rem;
      padding: .65rem 1.1rem;
      border: 0;
      border-radius: .7rem;
      color: #fff;
      background: #2857c5;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #1d459f; }

    .entries { display: grid; gap: .75rem; margin: 1.5rem 0 0; padding: 0; list-style: none; }
    .entry { padding: 1rem; border: 1px solid #e4e9f2; border-radius: .75rem; overflow-wrap: anywhere; }
    .entry time { display: block; margin-top: .5rem; color: #68748a; font-size: .85rem; }
    .empty { color: #68748a; }
    .status { min-height: 1.25rem; color: #a4262c; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Guestbook – v2</h1>
      <p class="intro">Leave a note for the next visitor.</p>
      <form id="guestbook-form">
        <label for="message">Your message</label>
        <textarea id="message" name="message" maxlength="500" required placeholder="Write something kind..."></textarea>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <button type="submit">Sign the guestbook</button>
      </form>
      <ul class="entries" id="entries" aria-label="Guestbook entries"></ul>
    </section>
  </main>
  <script>
    const storageKey = "guestbook-entries";
    const form = document.querySelector("#guestbook-form");
    const messageInput = document.querySelector("#message");
    const entriesList = document.querySelector("#entries");
    const status = document.querySelector("#status");

    function readEntries() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        status.textContent = "Saved entries could not be read from this browser.";
        return [];
      }
    }

    function renderEntries() {
      const entries = readEntries();
      entriesList.replaceChildren();

      if (entries.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "No messages yet. Be the first to sign!";
        entriesList.append(empty);
        return;
      }

      entries.slice().reverse().forEach((entry) => {
        const item = document.createElement("li");
        item.className = "entry";
        const text = document.createElement("div");
        text.textContent = entry.message;
        const time = document.createElement("time");
        time.dateTime = entry.createdAt;
        time.textContent = new Date(entry.createdAt).toLocaleString();
        item.append(text, time);
        entriesList.append(item);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = messageInput.value.trim();
      if (!message) {
        messageInput.focus();
        return;
      }

      try {
        const entries = readEntries();
        entries.push({ message, createdAt: new Date().toISOString() });
        localStorage.setItem(storageKey, JSON.stringify(entries));
        messageInput.value = "";
        status.textContent = "Your message has been added.";
        renderEntries();
      } catch {
        status.textContent = "This browser could not save your message.";
      }
    });

    renderEntries();
  </script>
</body>
</html>
